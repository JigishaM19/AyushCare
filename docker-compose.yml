version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ayushcare_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: ayushcare_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ayushcare_backend
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/ayushcare_db
      SECRET_KEY: ayushcare_hackathon_demo_secret_key_2026_sih
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ayushcare_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:

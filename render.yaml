services:
  # AyushCare FastAPI Backend Service
  - type: web
    name: ayushcare-backend
    runtime: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    rootDir: backend
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///./ayushcare.db

  # AyushCare React Vite Frontend Static Site
  - type: web
    name: ayushcare-frontend
    runtime: static
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    rootDir: frontend
    envVars:
      - key: NODE_VERSION
        value: 20.12.0
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
